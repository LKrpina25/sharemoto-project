services:
  db:
    image: postgres:16-alpine
    container_name: moto_postgres
    environment:
      POSTGRES_USER: moto_user
      POSTGRES_PASSWORD: moto_pass
      POSTGRES_DB: moto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: